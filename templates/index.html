<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <!-- style.css -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <header
      class="navbar sticky-top bg-dark flex-md-nowrap p-2 shadow"
      data-bs-theme="dark"
    >
      <h1 class="fs-4 fw-semibold text-white">Stock Choose LLM</h1>
    </header>
    <div class="container-fluid">
      <div class="row">
        <div
          class="d-flex flex-column align-items-stretch flex-shrink-0 bg-body-tertiary"
          style="width: 380px"
        >
          <h2 class="fs-5 fw-semibold p-2 mt-2">電子類 23</h2>
          <div
            class="list-group list-group-flush border-bottom scrollarea"
            id="stocks"
          >
            <!-- code text -->
          </div>
        </div>
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4" id="main"></main>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.11.0/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.11.0/js/anychart-stock.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.11.0/js/anychart-data-adapter.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.11.0/js/anychart-ui.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.11.0/js/anychart-exports.min.js"></script>
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
  </body>
  <script>
    let api = new API();
    let startDate = "2023-01-01";
    let endDate = "2025-02-21";

    // async function
    async function fetchStockCode() {
      return new Promise(async (resolve, reject) => {
        try {
          let data = await api.stockcode(23);
          let stockData = data.data;
          let formatData = [];
          for (let stockCode in stockData) {
            let object = {
              score: 0,
              code: stockCode,
              name: stockData[stockCode],
              reason: "",
            };
            formatData.push(object);
          }
          resolve(formatData);
        } catch (error) {
          reject(error);
        }
      });
    }
    async function fetchDayData(code) {
      return new Promise(async (resolve, reject) => {
        try {
          let ticker = `${code}.TW`;
          let data = await api.yfinance(ticker, startDate, endDate, "1d");
          if (data.message == "資料為空") alert("資料為空");
          resolve(data.data);
        } catch (error) {
          reject(error);
        }
      });
    }
    async function sortCodeData(codeData) {
      for (let stock of codeData) {
        let ticker = `${stock.code}.TW`;
        let data = await api.yfinance(ticker, startDate, endDate, "1wk");
        if (data.message == "資料為空") {
          stock.score = 0;
          stock.reason = "資料為空";
        } else {
          let stockData = data.data;
          let input1 = stockData;
          let output1 = await api.gemini("predict", stockData);
          let input2 = `${stock.code}.TW(${stock.name})這支股票的相關新聞`;
          let output2 = await api.gemini("search", input2);
          let input3 = {
            week_data: stockData,
            week_check_ma: output1,
            news: output2,
          };
          let output3 = await api.gemini("result", input3);
          let output3format = JSON.parse(output3.data);
          stock.score = output3format.score;
          stock.reason = output3format.reason;
          console.log("sortCodeData", stock);
        }
      }
      return new Promise((resolve, reject) => {
        codeData.sort((a, b) => b.score - a.score);
        resolve(codeData);
      });
    }
    // function
    function putStockCode(data) {
      $("#stocks").empty();
      for (let stock of data) {
        $("#stocks").append(`
        <a href="#" class="list-group-item list-group-item-action py-3 lh-sm codebox">
        <div class="d-flex w-100 align-items-center justify-content-between">
          <strong class="mb-1">${stock.name}</strong>
          <small class="text-body-secondary">${stock.code}</small>
        </div>
        <div class="col-10 mb-1 small">
          Score：${stock.score}
          Reason:${stock.reason}
        </div>
        </a>
      `);
      }
    }
    function drawStockChart(stockData) {
      document.getElementById("main").innerHTML = "";
      anychart.onDocumentReady(function () {
        // Convert the stockData JSON array to the format expected by AnyChart
        const data = stockData.map((item) => [
          item.date,
          item.open,
          item.high,
          item.low,
          item.close,
          item.volume, // Assuming volume is needed, adjust if not
        ]);

        // create data table on loaded data
        var dataTable = anychart.data.table();
        dataTable.addData(data);

        // map loaded data for the candlestick series
        var mapping = dataTable.mapAs({
          open: 1,
          high: 2,
          low: 3,
          close: 4,
        });

        // create stock chart
        var chart = anychart.stock();

        // create first plot on the chart
        var plot = chart.plot(0);

        // set grid settings
        plot.yGrid(true).xGrid(true).yMinorGrid(true).xMinorGrid(true);

        var series = plot.candlestick(mapping).name("Stock Data"); // Changed name to generic "Stock Data"

        // create scroller series with mapped data
        chart.scroller().candlestick(mapping);

        // set chart selected date/time range based on startDate and endDate
        chart.selectRange(startDate, endDate);

        // create range picker
        var rangePicker = anychart.ui.rangePicker();

        // init range picker
        rangePicker.render(chart);

        // create range selector
        var rangeSelector = anychart.ui.rangeSelector();

        // init range selector
        rangeSelector.render(chart);

        // sets the title of the chart
        chart.title("Stock Chart"); // Changed title to generic "Stock Chart"

        // set container id for the chart
        chart.container("main");

        // initiate chart drawing
        chart.draw();
      });
    }

    // on action
    $(document).on("click", ".codebox", async function (e) {
      $(".codebox").removeClass("active");
      $(this).addClass("active");
      let code = $(this).find("small").text();
      stockData = await fetchDayData(code);
      drawStockChart(stockData);
    });
    $(document).ready(async function (e) {
      let data = await fetchStockCode();
      console.log("index get code data", data);
      let sortData = await sortCodeData(data);
      console.log("index sort code data", sortData);
      putStockCode(sortData);
    });
  </script>
</html>
